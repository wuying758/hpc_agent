<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HPC 作业分析工作台</title>
<script>
(function(){try{var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<!-- 手机导航开关 -->
<button type="button" class="nav-toggle" id="navToggle" aria-label="导航" aria-controls="nav">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
</button>

<button type="button" id="navBackdrop" class="nav-backdrop" aria-label="关闭导航" hidden></button>

<!-- 登录弹窗 -->
<div id="loginModal" class="login-modal-overlay" hidden>
  <div class="login-modal">
    <h3>JAccount 登录</h3>
    <p class="login-sub">使用交我创 / HPC 账号登录后即可对话</p>
    <form id="loginForm">
      <label>用户名</label>
      <input type="text" id="loginUser" placeholder="wuying.hao" autocomplete="username" required>
      <label>密码</label>
      <input type="password" id="loginPass" placeholder="密码" autocomplete="current-password" required>
      <div id="loginError" class="login-error" hidden></div>
      <button type="submit" class="btn btn-primary" id="loginSubmit">登 录</button>
    </form>
  </div>
</div>

<!-- 左侧导航 -->
<aside id="nav">
  <div class="nav-brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      HPC 工作台
    </div>
    <small>SJTU 超算 · 交我创</small>
  </div>
  <nav>
    <a href="#/chat" data-page="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      智能分析
    </a>
    <a href="#/jobs" data-page="jobs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v16M2 8h20"/></svg>
      作业中心
    </a>
    <a href="#/tasks" data-page="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2zm0 0V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v10m-6 0a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m0 0V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/></svg>
      分析任务
    </a>
    <a href="#/tickets" data-page="tickets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
      工单中心
    </a>
  </nav>
  <div class="nav-footer">
    <button id="settingsBtn" title="设置">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      设置
    </button>
  </div>
</aside>

<!-- 设置面板 -->
<div id="settingsBackdrop" class="settings-backdrop" hidden></div>
<div id="settingsPanel" class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
  <div class="settings-dialog-inner">
    <div class="settings-dialog-head">
      <h3 id="settingsTitle">设置</h3>
      <button type="button" class="icon-btn" id="settingsClose" aria-label="关闭设置">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M6 18 18 6"/></svg>
      </button>
    </div>
    <div class="settings-dialog-body">
      <nav class="settings-nav" id="settingsNav" aria-label="设置分组">
        <button type="button" class="settings-nav-item active" data-group="appearance" aria-selected="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.15-.7-.4-1-.2-.3-.35-.6-.35-1 0-.8.65-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-4.96-4.5-9-10-9z"/></svg>
          <span>外观与账号</span>
        </button>
        <button type="button" class="settings-nav-item" data-group="data" aria-selected="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          <span>数据与连接</span>
        </button>
      </nav>
      <div class="settings-content">
        <section class="settings-group" data-group="appearance">
          <h4>外观与账号</h4>
          <p class="settings-group-desc">调整界面主题，查看当前登录账号</p>
          <div class="settings-field">
            <div class="settings-field-head">
              <span class="settings-field-label">账号</span>
              <span class="settings-field-hint">JAccount 登录状态</span>
            </div>
            <div class="settings-field-body">
              <div id="accountInfo" class="account-box"><span class="dim">加载中…</span></div>
            </div>
          </div>
          <div class="settings-field">
            <div class="settings-field-head">
              <span class="settings-field-label">主题</span>
              <span class="settings-field-hint">浅色 / 深色</span>
            </div>
            <div class="theme-toggle" id="themeToggle" role="group" aria-label="主题">
              <button type="button" class="theme-option active" data-theme="light">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
                <span>浅色</span>
              </button>
              <button type="button" class="theme-option" data-theme="dark">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <span>深色</span>
              </button>
            </div>
          </div>
        </section>
        <section class="settings-group" data-group="data" hidden>
          <div id="dataBody"></div>
        </section>
      </div>
    </div>
  </div>
</div>

<!-- 主区域 -->
<main id="main">
  <!-- 智能分析 -->
  <div id="page-chat" class="page">
    <!-- 历史会话侧栏（左侧并列） -->
    <aside id="sessionPanel" class="session-panel" aria-label="历史会话" hidden>
      <div class="sp-head">
        <h3>历史会话</h3>
        <div class="sp-head-actions">
          <button class="btn btn-sm" id="sessNew">+ 新建</button>
          <button class="btn btn-sm" id="sessClose">关闭</button>
        </div>
      </div>
      <div class="sp-list" id="spList"></div>
      <div class="sp-archived">
        <button class="sp-archived-toggle" id="spArchivedToggle" aria-expanded="false" aria-controls="spArchivedList">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          已归档聊天
        </button>
        <div class="sp-archived-list" id="spArchivedList" hidden></div>
      </div>
    </aside>
    <div class="chat-wrap">
      <!-- 页头 -->
      <div class="chat-header">
        <div>
          <h1>智能分析</h1>
          <p id="chatSessionTitle">基于集群数据的自然语言问答与诊断</p>
        </div>
        <div class="chat-header-actions">
          <button type="button" class="btn btn-sm new-chat-btn" id="newChatBtn" title="新建会话" aria-label="新建会话">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span>新会话</span>
          </button>
          <button class="btn btn-sm" id="ovToggleBtn" title="集群总览">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 5-9"/></svg>
            总览
          </button>
          <button class="btn btn-sm" id="sessBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            历史
          </button>
          <span class="auth-area">
            <button type="button" class="btn btn-sm" id="loginBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
              <span id="loginBtnText">登录</span>
            </button>
            <button type="button" class="btn btn-sm" id="logoutBtn" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              <span id="logoutBtnText">登出</span>
            </button>
          </span>
        </div>
      </div>
      <div id="chatNotice" class="chat-notice" role="status" hidden>
        <span id="chatNoticeText"></span>
        <button type="button" id="noticeRetry" hidden>重试</button>
        <button type="button" id="noticeDismiss" class="notice-dismiss" aria-label="关闭提示">&times;</button>
      </div>
      <!-- 消息区 -->
      <div id="msgs"><div class="chat-content"></div></div>
      <!-- 输入区 -->
      <div id="composer" class="composer">
        <div class="composer-inner">
          <div class="composer-card">
            <label class="sr-only" for="q">分析问题</label>
            <textarea id="q" rows="1" placeholder="描述你想排查的问题，或输入作业 ID…" autocomplete="off"></textarea>
            <div class="composer-bar">
              <span class="composer-hint">Enter 发送 <span>·</span> Shift + Enter 换行</span>
              <div class="right">
                <span class="ctx" id="ctxInfo">上下文 —</span>
                <select id="modelSel" title="模型"><option value="qwen">qwen</option></select>
                <button id="sendBtn" title="发送"></button>
              </div>
            </div>
            <div id="modelHint" class="model-hint" hidden></div>
          </div>
        </div>
      </div>
    </div>
    <!-- 集群总览侧栏 -->
    <aside id="ovPanel" class="ov-panel" aria-label="集群总览">
      <div class="ov-panel-head">
        <div class="ov-head-row">
          <h3>集群总览</h3>
          <div class="ov-head-actions">
            <select id="ovDaysSel" aria-label="总览时间窗口"><option value="7">7 天</option><option value="14">14 天</option><option value="30">30 天</option></select>
            <button type="button" class="icon-btn ov-close" id="ovClose" title="关闭总览" aria-label="关闭总览"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
          </div>
        </div>
      </div>
      <div class="ov-notice" id="ovNotice" role="status" hidden><span></span><button type="button">重试</button></div>
      <div class="ov-panel-body" id="ovBody"><div class="empty">加载中…</div></div>
    </aside>
  </div>

  <!-- 作业中心 -->
  <div id="page-jobs" class="page" hidden>
    <div class="page-header">
      <h2>作业中心</h2>
      <p id="jobsInfo">按条件筛选浏览作业</p>
    </div>
    <div class="filters">
      <select id="jStateSel"><option value="">全部状态</option><option>RUNNING</option><option>COMPLETED</option><option>FAILED</option><option>TIMEOUT</option><option>PENDING</option><option>CANCELLED</option></select>
      <select id="jDaysSel"><option value="7">近 7 天</option><option value="14">近 14 天</option><option value="30">近 30 天</option></select>
      <input id="jSearch" type="search" placeholder="搜索作业 ID 或名称">
    </div>
    <div class="table-wrap">
      <table class="table" id="jobsTable">
        <thead><tr><th>ID</th><th>名称</th><th>用户</th><th>分区</th><th>状态</th><th class="num">运行h</th><th class="num">核</th><th>提交</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="pagination">
      <button class="btn btn-sm" id="jPrev" disabled>上一页</button>
      <span id="jPageInfo">1/1</span>
      <button class="btn btn-sm" id="jNext" disabled>下一页</button>
    </div>
  </div>

  <!-- 分析任务 -->
  <div id="page-tasks" class="page" hidden>
    <div class="page-header page-header-actions">
      <div><h2>分析任务</h2><p>发起分析，保存步骤、证据和结论</p></div>
      <button type="button" class="btn btn-primary btn-sm" id="taskNewBtn">+ 新建任务</button>
    </div>
    <div id="taskForm" class="task-form">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input id="taskTitle" placeholder="任务标题（如：分析近7天反复失败）" style="flex:1;min-width:200px">
        <select id="taskDays" style="width:100px"><option value="7">7天</option><option value="14">14天</option><option value="30">30天</option></select>
        <button class="btn btn-primary btn-sm" id="taskStart">发起</button>
        <button class="btn btn-sm" id="taskCancelBtn">取消</button>
      </div>
      <textarea id="taskMsg" placeholder="具体分析问题（可选，默认用标题）" style="width:100%;margin-top:10px;min-height:36px"></textarea>
    </div>
    <div id="taskList"></div>
  </div>

  <!-- 工单中心 -->
  <div id="page-tickets" class="page" hidden>
    <div class="page-header">
      <h2>工单中心</h2>
      <p>跟踪诊断发现问题的处理进度</p>
    </div>
    <div class="filters">
      <select id="tkStatusSel"><option value="">全部状态</option><option value="pending">待处理</option><option value="in_progress">处理中</option><option value="resolved">已解决</option><option value="cancelled">已取消</option></select>
      <input id="tkSearch" type="search" placeholder="搜索工单号或原因">
    </div>
    <div id="ticketList"></div>
  </div>

  </div>
</main>

<!-- 右侧抽屉 -->
<div id="drawer" class="drawer" hidden>
  <div class="drawer-head">
    <h3 id="drawerTitle"></h3>
    <button id="drawerClose" aria-label="关闭">&times;</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
